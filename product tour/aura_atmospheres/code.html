<body class="bg-background text-on-background font-body-md overflow-hidden antialiased">

</div>
<!-- UI Overlay Shell -->

<!-- TopAppBar (Shared Component logic) -->

<div class="max-w-xl w-full">
<!-- Atmosphere Description Card -->

<div class="flex items-center gap-3 mb-6">

</div>
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg mb-4 text-on-surface">

<!-- Bottom Navigation Suppression Logic: This is a linear onboarding step. 
             Per "Shared Components Logic", we exclude the navigation shell to prioritize content. -->
</div>
<!-- Background Atmospheric Micro-interactions -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none z-0">
<div class="absolute w-[600px] h-[600px] rounded-full opacity-20 blur-[120px] bg-secondary-container pointer-events-none transition-transform duration-300 -translate-x-1/2 -translate-y-1/2" id="glow-cursor"></div>
</div>
<script>
        // Atmospheric mouse glow effect
        const glow = document.getElementById('glow-cursor');
        document.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        // Subtle parallax on background
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            const bg = document.querySelector('.bg-immersive');
            bg.style.transform = `scale(1.05) translate(${moveX}px, ${moveY}px)`;
        });
    </script>
