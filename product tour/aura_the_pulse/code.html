<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AURA - The Pulse</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            background: radial-gradient(circle at center, #170022 0%, #121414 100%);
            overflow: hidden;
            margin: 0;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }
        .pulse-orb {
            position: relative;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #63f7ff 0%, #006c71 100%);
            box-shadow: 0 0 80px rgba(0, 244, 254, 0.4), inset -10px -10px 40px rgba(0,0,0,0.5);
            animation: breathe 4s ease-in-out infinite;
        }
        .pulse-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 244, 254, 0.15) 0%, transparent 70%);
            animation: pulse-ring 4s ease-out infinite;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.2); }
        }
        @keyframes pulse-ring {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }
        .light-edge {
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "error-container": "#93000a",
                    "on-tertiary": "#520070",
                    "error": "#ffb4ab",
                    "on-background": "#e2e2e2",
                    "secondary-container": "#00f4fe",
                    "on-primary-fixed-variant": "#4e415d",
                    "tertiary": "#ecb1ff",
                    "on-tertiary-fixed": "#320046",
                    "surface": "#121414",
                    "secondary-fixed-dim": "#00dce5",
                    "surface-bright": "#37393a",
                    "inverse-on-surface": "#2f3131",
                    "inverse-primary": "#665976",
                    "surface-tint": "#d1c0e2",
                    "surface-container-lowest": "#0c0f0f",
                    "on-primary-container": "#827392",
                    "surface-container-low": "#1a1c1c",
                    "on-primary": "#372b46",
                    "on-secondary-fixed-variant": "#004f53",
                    "surface-container-highest": "#333535",
                    "tertiary-fixed-dim": "#ecb1ff",
                    "on-error-container": "#ffdad6",
                    "on-surface-variant": "#cbc4cd",
                    "surface-variant": "#333535",
                    "outline-variant": "#49454c",
                    "on-secondary-container": "#006c71",
                    "outline": "#958f97",
                    "on-secondary": "#003739",
                    "secondary-fixed": "#63f7ff",
                    "on-tertiary-container": "#c118ff",
                    "surface-container": "#1e2020",
                    "primary-fixed-dim": "#d1c0e2",
                    "tertiary-fixed": "#f9d8ff",
                    "surface-dim": "#121414",
                    "inverse-surface": "#e2e2e2",
                    "primary": "#d1c0e2",
                    "primary-fixed": "#eedcff",
                    "on-primary-fixed": "#211630",
                    "primary-container": "#0f051d",
                    "surface-container-high": "#282a2b",
                    "tertiary-container": "#170022",
                    "on-secondary-fixed": "#002021",
                    "on-tertiary-fixed-variant": "#75009e",
                    "on-surface": "#e2e2e2",
                    "background": "#121414",
                    "on-error": "#690005",
                    "secondary": "#e6feff"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "24px",
                    "card-gap": "24px",
                    "container-margin-mobile": "24px",
                    "unit": "8px",
                    "container-margin-desktop": "80px"
            },
            "fontFamily": {
                    "body-lg": ["Inter"],
                    "label-md": ["Inter"],
                    "display-lg-mobile": ["Syne"],
                    "headline-sm": ["Syne"],
                    "headline-md": ["Syne"],
                    "display-lg": ["Syne"],
                    "body-md": ["Inter"],
                    "label-sm": ["Inter"]
            },
            "fontSize": {
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "display-lg-mobile": ["36px", {"lineHeight": "42px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "headline-md": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}]
            }
          }
        }
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen text-on-surface flex flex-col items-center">
<!-- Top Navigation Bar -->
<header class="flex items-center justify-center px-gutter pt-8 w-full z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary font-headline-md text-headline-md" style="font-variation-settings: 'FILL' 1;">blur_on</span>
<h1 class="font-headline-md text-headline-md tracking-widest text-secondary uppercase">AURA</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center w-full max-w-[1200px] px-container-margin-mobile md:px-container-margin-desktop pb-24">
<!-- Central Visualization Area -->
<div class="relative flex flex-col items-center justify-center mb-12">
<div class="pulse-glow"></div>
<div class="pulse-orb"></div>
<!-- Floating Data Chips (Mobile Hidden for Focus) -->
<div class="absolute -top-4 -right-12 hidden md:block">
<div class="glass-panel light-edge p-4 rounded-xl flex items-center gap-3">
<span class="material-symbols-outlined text-secondary-container">bolt</span>
<div>
<p class="font-label-sm text-label-sm opacity-60">Usage</p>
<p class="font-body-lg text-body-lg font-bold">1.2 kW</p>
</div>
</div>
</div>
<div class="absolute bottom-8 -left-16 hidden md:block">
<div class="glass-panel light-edge p-4 rounded-xl flex items-center gap-3">
<span class="material-symbols-outlined text-tertiary">air</span>
<div>
<p class="font-label-sm text-label-sm opacity-60">Quality</p>
<p class="font-body-lg text-body-lg font-bold">98%</p>
</div>
</div>
</div>
</div>
<!-- Textual Identity Section -->
<div class="text-center max-w-lg mb-12">
<h2 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg mb-4 text-white">The Pulse</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant opacity-80 leading-relaxed">
                Your home’s heartbeat, visualized in real-time. Energy, security, and air quality at a glance.
            </p>
</div>
<!-- Bento Grid for Quick Stats (Glassmorphic) -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full mb-12">
<div class="glass-panel light-edge p-6 rounded-lg flex flex-col items-center gap-2 group hover:border-secondary-container transition-colors duration-500">
<span class="material-symbols-outlined text-secondary-container text-[32px]">shield_lock</span>
<p class="font-label-md text-label-md text-secondary-container uppercase tracking-widest">Security</p>
<p class="font-headline-sm text-headline-sm">Armed</p>
</div>
<div class="glass-panel light-edge p-6 rounded-lg flex flex-col items-center gap-2 group hover:border-secondary-container transition-colors duration-500">
<span class="material-symbols-outlined text-secondary-container text-[32px]">thermostat</span>
<p class="font-label-md text-label-md text-secondary-container uppercase tracking-widest">Climate</p>
<p class="font-headline-sm text-headline-sm">72°F</p>
</div>
<div class="glass-panel light-edge p-6 rounded-lg flex flex-col items-center gap-2 group hover:border-secondary-container transition-colors duration-500">
<span class="material-symbols-outlined text-secondary-container text-[32px]">energy_savings_leaf</span>
<p class="font-label-md text-label-md text-secondary-container uppercase tracking-widest">Eco Mode</p>
<p class="font-headline-sm text-headline-sm">Active</p>
</div>
</div>
</main>
<!-- Footer Controls -->
<footer class="fixed bottom-0 w-full z-50 flex flex-col items-center gap-6 pb-12 px-gutter">
<!-- Progress Indicator -->
<div class="flex gap-3">
<div class="h-1.5 w-12 rounded-full bg-secondary-container shadow-[0_0_8px_rgba(0,244,254,0.6)]"></div>
<div class="h-1.5 w-8 rounded-full bg-surface-variant"></div>
<div class="h-1.5 w-8 rounded-full bg-surface-variant"></div>
<div class="h-1.5 w-8 rounded-full bg-surface-variant"></div>
</div>
<!-- CTA Button -->
<div class="w-full max-w-sm">
<button class="w-full h-16 rounded-full bg-gradient-to-r from-secondary-container to-tertiary text-on-surface font-headline-sm text-headline-sm flex items-center justify-center gap-3 shadow-lg hover:opacity-90 active:scale-95 transition-all duration-300" onclick="handleNext()">
                Next
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</footer>
<!-- Background Atmospheric Glows -->
<div class="fixed top-[-10%] left-[-10%] w-[40vw] h-[40vw] bg-tertiary-container/30 rounded-full blur-[120px] pointer-events-none -z-10"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] bg-on-tertiary-container/20 rounded-full blur-[120px] pointer-events-none -z-10"></div>
<script>
        function handleNext() {
            // Animation for transition
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease-out';
            setTimeout(() => {
                // Mock navigation to next step
                console.log('Navigating to step 2 of 4');
            }, 500);
        }

        // Parallax effect for orb
        document.addEventListener('mousemove', (e) => {
            const orb = document.querySelector('.pulse-orb');
            const x = (window.innerWidth / 2 - e.pageX) / 40;
            const y = (window.innerHeight / 2 - e.pageY) / 40;
            orb.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body></html>
