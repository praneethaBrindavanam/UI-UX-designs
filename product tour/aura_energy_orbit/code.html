<style>
    body {
      background-color: #121414;
      color: #e2e2e2;
      overflow-x: hidden;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    .orbit-container {
      perspective: 1000px;
    }

    .orbit-ring {
      border: 2px dashed rgba(0, 244, 254, 0.2);
      border-radius: 50%;
      position: absolute;
      transform-style: preserve-3d;
      animation: rotate-orbit 20s linear infinite;
    }

    .orbit-ring-active {
      border: 2px solid rgba(0, 244, 254, 0.5);
      box-shadow: 0 0 20px rgba(0, 244, 254, 0.2);
    }

    @keyframes rotate-orbit {
      from { transform: rotateX(60deg) rotateZ(0deg); }
      to { transform: rotateX(60deg) rotateZ(360deg); }
    }

    .energy-node {
      width: 12px;
      height: 12px;
      background: #00f4fe;
      border-radius: 50%;
      box-shadow: 0 0 15px #00f4fe;
      position: absolute;
      top: 50%;
      left: 100%;
      transform: translate(-50%, -50%);
    }

    .glow-cyan {
      box-shadow: 0 0 30px rgba(0, 244, 254, 0.25);
    }

    .gradient-primary {
      background: linear-gradient(135deg, #00f4fe 0%, #d1c0e2 100%);
    }

    .bg-space {
      background: radial-gradient(circle at 50% 50%, #1e122b 0%, #121414 70%);
    }

    .shimmer {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      background-size: 200% 100%;
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-space min-h-screen flex flex-col font-body-md text-on-background">
<!-- Top Navigation Shell -->
<header class="flex items-center justify-center px-gutter pt-8 w-full z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary font-headline-md text-headline-md" style="font-variation-settings: 'FILL' 1;">blur_on</span>
<h1 class="font-headline-md text-headline-md tracking-widest text-secondary">AURA</h1>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-container-margin-mobile md:px-container-margin-desktop py-12">
<!-- 3D Orbit Visualization Section -->
<div class="relative w-full max-w-lg aspect-square flex items-center justify-center orbit-container mb-12">
<!-- Background Ambient Glow -->
<div class="absolute w-64 h-64 bg-secondary-container opacity-10 rounded-full blur-[100px]"></div>
<!-- Orbit Rings -->
<div class="orbit-ring w-[300px] h-[300px]">
<div class="energy-node"></div>
</div>
<div class="orbit-ring w-[220px] h-[220px] animation-delay-[-5s] opacity-60" style="animation-duration: 15s;">
<div class="energy-node !bg-tertiary !shadow-tertiary"></div>
</div>
<div class="orbit-ring w-[380px] h-[380px] animation-delay-[-10s] opacity-40" style="animation-duration: 25s;">
<div class="energy-node"></div>
</div>
<!-- Central Core Display -->
<div class="glass-panel w-48 h-48 rounded-full flex flex-col items-center justify-center z-10 border-secondary-container/30 glow-cyan">
<span class="text-secondary-container font-headline-sm text-headline-sm">98%</span>
<span class="text-outline text-label-sm font-label-sm uppercase tracking-widest">Optimized</span>
<div class="mt-2 flex items-center gap-1">
<span class="material-symbols-outlined text-secondary-container text-sm">bolt</span>
<span class="text-secondary-container text-label-sm font-label-sm">2.4kW</span>
</div>
</div>
<!-- Data Chips (Floating UI) -->
<div class="absolute top-0 right-0 glass-panel px-4 py-2 rounded-full border-secondary-container/20 flex items-center gap-2 animate-bounce transition-all duration-[3000ms]">
<span class="material-symbols-outlined text-secondary-container text-sm" style="font-variation-settings: 'FILL' 1;">solar_power</span>
<span class="text-label-sm font-label-sm text-on-surface">Solar: Active</span>
</div>
<div class="absolute bottom-10 left-0 glass-panel px-4 py-2 rounded-full border-tertiary/20 flex items-center gap-2">
<span class="material-symbols-outlined text-tertiary text-sm" style="font-variation-settings: 'FILL' 1;">eco</span>
<span class="text-label-sm font-label-sm text-on-surface">CO2 Saved: 12kg</span>
</div>
</div>
<!-- Content Section -->
<div class="max-w-xl text-center space-y-6">
<div class="space-y-2">
<h2 class="font-headline-md text-headline-md md:text-display-lg md:font-display-lg text-secondary">Energy Orbit.</h2>
<p class="text-on-surface-variant font-body-lg text-body-lg max-w-md mx-auto">
          Optimize your footprint. Aura intelligently shifts loads to save costs and reduce carbon impact.
        </p>
</div>
<!-- Progress and Action -->
<div class="pt-8 flex flex-col items-center gap-8 w-full">
<!-- Progress Indicator 4 of 4 -->
<div class="flex gap-3 items-center">
<div class="w-2 h-2 rounded-full bg-outline opacity-30"></div>
<div class="w-2 h-2 rounded-full bg-outline opacity-30"></div>
<div class="w-2 h-2 rounded-full bg-outline opacity-30"></div>
<div class="w-12 h-2 rounded-full bg-secondary-container glow-cyan"></div>
</div>
<button class="gradient-primary text-background font-label-md text-label-md px-12 py-5 rounded-full hover:scale-105 transition-transform duration-300 shadow-xl shadow-secondary-container/20 active:scale-95 group relative overflow-hidden">
<span class="relative z-10">Get Started</span>
<div class="absolute inset-0 shimmer opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
</div>
</div>
</main>
<!-- Bottom Navigation Shell (Minimized for Onboarding Context) -->
<footer class="fixed bottom-0 w-full z-50 flex flex-col items-center gap-6 pb-12">
<div class="flex items-center gap-8">
<span class="material-symbols-outlined text-outline opacity-30 font-label-sm text-label-sm">fiber_manual_record</span>
<span class="material-symbols-outlined text-outline opacity-30 font-label-sm text-label-sm">fiber_manual_record</span>
<span class="material-symbols-outlined text-outline opacity-30 font-label-sm text-label-sm">fiber_manual_record</span>
<span class="material-symbols-outlined text-secondary scale-125 transition-transform font-label-sm text-label-sm" style="font-variation-settings: 'FILL' 1;">fiber_manual_record</span>
</div>
</footer>
<!-- Floating Atmosphere Elements -->
<div class="fixed top-1/4 -left-20 w-64 h-64 bg-tertiary opacity-5 rounded-full blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-1/4 -right-20 w-80 h-80 bg-secondary opacity-5 rounded-full blur-[150px] pointer-events-none"></div>
<script>
    // Subtle interactivity for the orbit nodes
    document.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth - 0.5) * 20;
        const y = (e.clientY / window.innerHeight - 0.5) * 20;
        const container = document.querySelector('.orbit-container');
        if (container) {
            container.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        }
    });

    // Simulated Dynamic Power Flux
    setInterval(() => {
        const coreVal = document.querySelector('.central-core-val');
        if (coreVal) {
            const current = parseFloat(coreVal.innerText);
            const flux = (Math.random() - 0.5) * 0.2;
            coreVal.innerText = (current + flux).toFixed(1) + 'kW';
        }
    }, 3000);
  </script>
</body></html>
