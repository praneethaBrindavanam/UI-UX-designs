<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AURA - Ghost Mode</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "error-container": "#93000a",
                      "on-tertiary": "#520070",
                      "error": "#ffb4ab",
                      "on-background": "#e2e2e2",
                      "secondary-container": "#00f4fe",
                      "on-primary-fixed-variant": "#4e415d",
                      "tertiary": "#ecb1ff",
                      "on-tertiary-fixed": "#320046",
                      "surface": "#121414",
                      "secondary-fixed-dim": "#00dce5",
                      "surface-bright": "#37393a",
                      "inverse-on-surface": "#2f3131",
                      "inverse-primary": "#665976",
                      "surface-tint": "#d1c0e2",
                      "surface-container-lowest": "#0c0f0f",
                      "on-primary-container": "#827392",
                      "surface-container-low": "#1a1c1c",
                      "on-primary": "#372b46",
                      "on-secondary-fixed-variant": "#004f53",
                      "surface-container-highest": "#333535",
                      "tertiary-fixed-dim": "#ecb1ff",
                      "on-error-container": "#ffdad6",
                      "on-surface-variant": "#cbc4cd",
                      "surface-variant": "#333535",
                      "outline-variant": "#49454c",
                      "on-secondary-container": "#006c71",
                      "outline": "#958f97",
                      "on-secondary": "#003739",
                      "secondary-fixed": "#63f7ff",
                      "on-tertiary-container": "#c118ff",
                      "surface-container": "#1e2020",
                      "primary-fixed-dim": "#d1c0e2",
                      "tertiary-fixed": "#f9d8ff",
                      "surface-dim": "#121414",
                      "inverse-surface": "#e2e2e2",
                      "primary": "#d1c0e2",
                      "primary-fixed": "#eedcff",
                      "on-primary-fixed": "#211630",
                      "primary-container": "#0f051d",
                      "surface-container-high": "#282a2b",
                      "tertiary-container": "#170022",
                      "on-secondary-fixed": "#002021",
                      "on-tertiary-fixed-variant": "#75009e",
                      "on-surface": "#e2e2e2",
                      "background": "#121414",
                      "on-error": "#690005",
                      "secondary": "#e6feff"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "24px",
                      "card-gap": "24px",
                      "container-margin-mobile": "24px",
                      "unit": "8px",
                      "container-margin-desktop": "80px"
              },
              "fontFamily": {
                      "body-lg": ["Inter"],
                      "label-md": ["Inter"],
                      "display-lg-mobile": ["Syne"],
                      "headline-sm": ["Syne"],
                      "headline-md": ["Syne"],
                      "display-lg": ["Syne"],
                      "body-md": ["Inter"],
                      "label-sm": ["Inter"]
              },
              "fontSize": {
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "display-lg-mobile": ["36px", {"lineHeight": "42px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                      "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                      "headline-md": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}]
              }
            },
          },
        }
    </script>
<style>
        body {
            background-color: #121414;
            color: #e2e2e2;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }
        .hologram-glow {
            filter: drop-shadow(0 0 15px rgba(236, 177, 255, 0.4));
            animation: pulse 4s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }
        .scanline {
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, #ecb1ff, transparent);
            opacity: 0.3;
            position: absolute;
            animation: scan 3s linear infinite;
        }
        @keyframes scan {
            from { top: 0%; }
            to { top: 100%; }
        }
        .bg-mesh {
            background-image: 
                radial-gradient(at 0% 0%, rgba(82, 0, 112, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 220, 229, 0.1) 0px, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-mesh min-h-screen flex flex-col font-body-md text-body-md">
<!-- Top App Bar -->
<header class="flex items-center justify-center px-gutter pt-8 w-full top-0 bg-transparent">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary font-headline-sm text-headline-sm" style="font-variation-settings: 'FILL' 1;">blur_on</span>
<h1 class="font-headline-md text-headline-md tracking-widest text-secondary dark:text-secondary uppercase">AURA</h1>
</div>
</header>
<main class="flex-1 flex flex-col items-center justify-center px-container-margin-mobile md:px-container-margin-desktop py-12 relative overflow-hidden">
<!-- Holographic Visual -->
<div class="relative w-64 h-64 md:w-80 md:h-80 flex items-center justify-center mb-12">
<!-- Background Glow -->
<div class="absolute inset-0 bg-tertiary opacity-10 blur-[80px] rounded-full"></div>
<!-- Hologram Container -->
<div class="relative glass-panel rounded-full w-full h-full flex items-center justify-center border-tertiary/20 overflow-hidden">
<div class="scanline"></div>
<!-- Shield Icon -->
<div class="hologram-glow text-tertiary flex flex-col items-center justify-center gap-4">
<span class="material-symbols-outlined text-[120px] leading-none" style="font-variation-settings: 'FILL' 0, 'wght' 200;">shield_with_heart</span>
<div class="flex gap-1">
<div class="w-1 h-1 bg-tertiary rounded-full animate-ping"></div>
<div class="w-1 h-1 bg-tertiary rounded-full animate-ping [animation-delay:0.2s]"></div>
<div class="w-1 h-1 bg-tertiary rounded-full animate-ping [animation-delay:0.4s]"></div>
</div>
</div>
<!-- Circular Accents -->
<div class="absolute inset-4 border border-dashed border-tertiary/30 rounded-full animate-[spin_20s_linear_infinite]"></div>
<div class="absolute inset-12 border border-tertiary/10 rounded-full"></div>
</div>
</div>
<!-- Content Section -->
<div class="max-w-2xl text-center space-y-6 z-10">
<h2 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface">Ghost Mode</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed max-w-lg mx-auto">
                Total privacy, no compromises. End-to-end encrypted local control ensures your data never leaves your walls.
            </p>
</div>
<!-- Interactions & Controls -->
<div class="mt-16 w-full max-w-md flex flex-col items-center gap-10">
<!-- Progress Indicator -->
<div class="flex items-center gap-3">
<div class="h-1.5 w-8 rounded-full bg-outline opacity-20"></div>
<div class="h-1.5 w-8 rounded-full bg-outline opacity-20"></div>
<div class="h-1.5 w-12 rounded-full bg-gradient-to-right from-secondary-container to-tertiary shadow-[0_0_10px_rgba(236,177,255,0.5)]"></div>
<div class="h-1.5 w-8 rounded-full bg-outline opacity-20"></div>
</div>
<!-- Next Button -->
<button class="w-full py-5 rounded-full bg-gradient-to-r from-secondary-container to-tertiary text-on-primary font-label-md text-label-md uppercase tracking-widest shadow-[0_10px_40px_-10px_rgba(0,244,254,0.4)] hover:scale-[1.02] active:scale-[0.98] transition-all duration-300">
                Proceed to Secure Link
            </button>
<button class="text-on-surface-variant font-label-sm text-label-sm uppercase tracking-widest hover:text-tertiary transition-colors">
                Skip for now
            </button>
</div>
</main>
<!-- Bottom Navigation Mock (Only if needed, but per instructions for transactional/onboarding we suppress main nav. Using progress indicator instead) -->
<!-- Decorative Elements -->
<div class="fixed top-1/4 -right-20 w-96 h-96 bg-secondary/5 blur-[120px] rounded-full pointer-events-none"></div>
<div class="fixed bottom-1/4 -left-20 w-96 h-96 bg-tertiary/5 blur-[120px] rounded-full pointer-events-none"></div>
<script>
        // Micro-interactions for the hologram
        document.addEventListener('mousemove', (e) => {
            const hologram = document.querySelector('.hologram-glow');
            if (hologram) {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
                hologram.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });
    </script>
</body></html>
