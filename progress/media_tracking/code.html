<script>
        const playToggle = document.getElementById('playToggle');
        let isPlaying = true;

        playToggle.addEventListener('click', () => {
            isPlaying = !isPlaying;
            const icon = playToggle.querySelector('.material-symbols-outlined');
            icon.textContent = isPlaying ? 'pause' : 'play_arrow';
            icon.setAttribute('data-icon', isPlaying ? 'pause' : 'play_arrow');
        });

        // Simple parallax effect for background
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            const bg = document.querySelector('img[data-alt*="wormhole"]');
            bg.style.transform = `scale(1.1) translate(${x * 20}px, ${y * 20}px)`;
        });

        // Progress bar interaction simulation
        const progressBar = document.getElementById('progressBar');
        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const percentage = Math.max(0, Math.min(100, (x / rect.width) * 100));
            progressBar.querySelector('.bg-primary').style.width = `${percentage}%`;
        });
    </script>
