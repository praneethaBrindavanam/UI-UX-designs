<body class="min-h-screen flex flex-col items-center selection:bg-secondary-container">
<!-- Top AppBar Component (Suppressed version for Transactional flow) -->
<nav class="w-full flex justify-between items-center px-margin-mobile py-md max-w-7xl mx-auto">
<div class="flex items-center">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer hover:opacity-70 transition-opacity">close</span>
</div>
<div class="absolute left-1/2 -translate-x-1/2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile tracking-widest text-primary uppercase">AURA</h1>
</div>
<div class="w-6"></div> <!-- Spacer for symmetry -->
</nav>
<main class="w-full max-w-md px-margin-mobile flex-1 flex flex-col justify-center py-lg animate-fade-in">
<!-- Header Section -->
<header class="text-center mb-xl">
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-xs">Begin Your Journey</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Join our community of mindful movement.</p>
</header>
<!-- Form Section -->
<form class="space-y-md" onsubmit="event.preventDefault();">
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="full_name">Full Name</label>
<div class="relative">
<input class="w-full px-md py-4 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md text-body-md input-focus-ring transition-all placeholder:text-outline" id="full_name" placeholder="E.g. Julianne Moore" type="text"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<input class="w-full px-md py-4 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md text-body-md input-focus-ring transition-all placeholder:text-outline" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="password">Create Password</label>
<div class="relative">
<input class="w-full px-md py-4 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md text-body-md input-focus-ring transition-all placeholder:text-outline" id="password" placeholder="Min. 8 characters" type="password"/>
</div>
</div>
<button class="w-full bg-primary-container text-on-primary font-label-lg text-label-lg py-4 rounded-xl shadow-sm hover:opacity-90 active:scale-[0.98] transition-all mt-sm" type="submit">
                Join Aura
            </button>
</form>
<!-- Social Divider -->
<div class="relative my-xl flex items-center">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Or sign up with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Login Grid -->
<div class="grid grid-cols-2 gap-md mb-xl">
<button class="flex items-center justify-center gap-base py-3 border border-outline-variant rounded-xl bg-surface-container-lowest hover:bg-surface-container-low transition-colors active:scale-95 duration-200">

</svg>

<div class="absolute -bottom-40 -right-40 w-[500px] h-[500px] bg-primary-fixed/10 blur-[120px] rounded-full"></div>

</div>
<script>
        // Simple micro-interaction for input fields
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.previousElementSibling.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                if (!input.value) {
                    input.parentElement.previousElementSibling.classList.remove('text-primary');
                }
            });
        });

        // Form Submission visual feedback
        const form = document.querySelector('form');
        form.addEventListener('submit', (e) => {
            const btn = form.querySelector('button');
            const originalText = btn.innerText;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin" style="font-size: 20px;">sync</span>`;
            btn.classList.add('opacity-80', 'pointer-events-none');
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('opacity-80', 'pointer-events-none');
            }, 2000);
        });
    </script>
</body></html>
