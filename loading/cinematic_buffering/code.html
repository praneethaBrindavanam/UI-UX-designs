<!-- TopAppBar -->

</div>
<div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2">

</div>
<div class="flex items-center justify-center h-full">
<div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden border border-outline-variant/50">

</div>
</div>
</header>

<div class="absolute inset-0 cinematic-grain pointer-events-none"></div>
<div class="absolute inset-0 bg-gradient-to-b from-background via-surface-dim to-background opacity-90 pointer-events-none"></div>

<div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-[300px] h-[300px] bg-tertiary/5 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-1/4 left-1/2 -translate-x-1/2 w-[400px] h-[400px] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
<!-- Loading State Container -->
<div class="relative z-10 flex flex-col items-center gap-12 text-center max-w-[480px]">
<!-- The Radial Pulse (Focal Point) -->
<div class="relative">
<!-- Outer Glow Ring -->
<div class="w-32 h-32 rounded-full radial-pulse-ring flex items-center justify-center animate-pulse">
<!-- Inner Rotating Indicator (Simulated with CSS) -->
<div class="absolute inset-0 rounded-full border-t-4 border-tertiary animate-spin opacity-80" style="animation-duration: 1.5s;"></div>
<!-- Iconic Center -->
<span class="material-symbols-outlined text-tertiary text-4xl" data-icon="speed">speed</span>
</div>
</div>
<!-- Content Text -->
<div class="space-y-4">
<p class="font-label-mono-mobile text-label-mono-mobile text-tertiary uppercase tracking-widest opacity-80">Buffering Assets</p>

<p class="text-on-surface-variant max-w-[280px] mx-auto opacity-70">Optimizing resolution and immersive sound layers for high-velocity playback.</p>
