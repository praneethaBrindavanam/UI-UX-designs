<body class="bg-background text-on-background font-body-lg text-body-lg min-h-screen flex flex-col">
<!-- TopAppBar Section -->
<header class="bg-background dark:bg-background flex items-center justify-between px-margin-mobile h-touch-target-min w-full z-50 sticky top-0">
<div class="flex items-center gap-4">
<button class="hover:bg-surface-variant/50 transition-colors p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary">Create Account</h1>
</div>
<div class="font-label-md text-label-md text-on-surface-variant">
            Step 1 of 3
        </div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile py-stack-lg max-w-md mx-auto w-full flex flex-col gap-stack-lg">
<!-- Progress Bar -->
<div class="w-full bg-primary/10 h-1.5 rounded-full overflow-hidden">
<div class="bg-primary h-full step-transition" style="width: 33.33%;"></div>
</div>
<!-- Welcome Section -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Let's get started</h2>
<p class="text-on-surface-variant font-body-lg text-body-lg">
                We're setting up your profile to personalize your experience. First, tell us a bit about yourself.
            </p>
</section>
<!-- Form Section -->
<form class="flex flex-col gap-stack-md" id="registration-form">
<!-- Full Name Input -->
<div class="flex flex-col gap-stack-sm group">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="full_name">Full Name</label>
<div class="relative h-14 bg-tertiary/5 rounded-lg border-2 border-transparent focus-within:border-primary/20 focus-within:bg-white transition-all duration-200">
<input class="w-full h-full bg-transparent px-4 py-2 border-none focus:ring-0 text-on-surface placeholder:text-on-surface-variant/40" id="full_name" placeholder="e.g. Alex Johnson" type="text"/>
</div>
</div>
<!-- Email Address Input -->
<div class="flex flex-col gap-stack-sm group">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email_address">Email Address</label>
<div class="relative h-14 bg-tertiary/5 rounded-lg border-2 border-transparent focus-within:border-primary/20 focus-within:bg-white transition-all duration-200">
<input class="w-full h-full bg-transparent px-4 py-2 border-none focus:ring-0 text-on-surface placeholder:text-on-surface-variant/40" id="email_address" placeholder="alex@example.com" type="email"/>
</div>
</div>
<!-- Aesthetic Visual Element (Bento-style placeholder) -->
<div class="mt-stack-sm rounded-xl overflow-hidden shadow-[0px_4px_12px_rgba(0,0,0,0.05)] bg-surface-container-lowest">
<img alt="Supportive workspace" class="w-full h-40 object-cover" data-alt="A serene and highly professional modern workspace with soft, diffused sunlight filtering through a large window. The scene features a clean white desk, a single green plant in a ceramic pot, and a minimalist notebook, evoking a sense of calm organization and approachable reliability. The lighting is high-key and bright, utilizing a palette of soft teals and warm whites to match a friendly, corporate modern aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD97GPSzZzDaPSrWOlIHAJzVrAfDi1SXqMviqxVIaORmcB35fHE_pfxrdKCzuV6LZcFnDxqIH25kqdXfaHARIoOJLf966F94w4FVQoo48YIxTZyP4lCWSIMLD8FYLvo5j6_bnKRYVoyd-y3CEsahMpOvuBrAUnjux2KVWsZ5FFqVZl7ZRKea6EXo_fAPlISuz5TkncSe0xu2Lc1PueILonFvyID_xt4RvrZNNdSUz3XSD3n4t3MVI4ZXKBFJrTWBEl5UrEL7jE9ww"/>
<div class="p-4 bg-surface-container-lowest">
<p class="font-label-md text-label-md text-primary">Security &amp; Trust</p>
<p class="text-on-surface-variant text-sm mt-1">Your data is encrypted and never shared with third parties without your permission.</p>
</div>
</div>
</form></main>
<!-- BottomNavBar Section -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex gap-stack-md px-margin-mobile py-4 bg-surface-container-lowest dark:bg-inverse-surface shadow-[0px_-4px_12px_rgba(0,0,0,0.05)] rounded-t-xl">
<button class="flex flex-row items-center justify-center border border-primary text-primary bg-transparent rounded-lg px-6 py-4 w-full font-label-md text-label-md hover:opacity-90 transition-opacity active:scale-[0.98] transition-transform duration-150">
<span class="material-symbols-outlined mr-2" data-icon="chevron_left">chevron_left</span>
            Back
        </button>
<button class="flex flex-row items-center justify-center bg-primary text-on-primary rounded-lg px-6 py-4 w-full font-label-md text-label-md hover:opacity-90 transition-opacity active:scale-[0.98] transition-transform duration-150">
            Continue

</button>
</nav>
<!-- Bottom Spacer to prevent content overlap -->
<div class="h-24"></div>
<script>
        // Simple micro-interaction for input fields
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('shadow-[0_0_0_4px_rgba(0,104,95,0.1)]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('shadow-[0_0_0_4px_rgba(0,104,95,0.1)]');
            });
        });
    </script>
