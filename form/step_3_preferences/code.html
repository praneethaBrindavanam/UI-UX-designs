<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .interest-chip.active {
            background-color: #d8e2ff; /* secondary-fixed */
            border-color: #0058be; /* secondary */
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#263143",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#adc6ff",
                        "on-secondary-fixed-variant": "#004395",
                        "outline-variant": "#bcc9c6",
                        "background": "#f9f9ff",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#f4fffc",
                        "on-surface": "#111c2d",
                        "surface-variant": "#d8e3fb",
                        "surface-bright": "#f9f9ff",
                        "tertiary": "#525e5c",
                        "surface-container-highest": "#d8e3fb",
                        "on-secondary-fixed": "#001a42",
                        "tertiary-fixed-dim": "#bcc9c6",
                        "surface-container-high": "#dee8ff",
                        "inverse-primary": "#6bd8cb",
                        "primary-fixed": "#89f5e7",
                        "on-surface-variant": "#3d4947",
                        "surface-tint": "#006a61",
                        "inverse-on-surface": "#ecf1ff",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#008378",
                        "surface": "#f9f9ff",
                        "on-tertiary-fixed": "#121e1c",
                        "surface-dim": "#cfdaf2",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#f3fffc",
                        "primary-fixed-dim": "#6bd8cb",
                        "on-background": "#111c2d",
                        "on-secondary-container": "#fefcff",
                        "on-error": "#ffffff",
                        "surface-container": "#e7eeff",
                        "secondary": "#0058be",
                        "primary": "#00685f",
                        "on-primary-fixed": "#00201d",
                        "error-container": "#ffdad6",
                        "secondary-container": "#2170e4",
                        "secondary-fixed": "#d8e2ff",
                        "tertiary-fixed": "#d8e5e2",
                        "tertiary-container": "#6b7775",
                        "on-primary-fixed-variant": "#005049",
                        "surface-container-low": "#f0f3ff",
                        "outline": "#6d7a77",
                        "on-tertiary-fixed-variant": "#3d4947"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "1rem",
                        "stack-sm": "0.5rem",
                        "margin-mobile": "1.5rem",
                        "touch-target-min": "3rem",
                        "gutter-mobile": "1rem",
                        "stack-lg": "2rem"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg-mobile": ["26px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-on-surface font-body-lg min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="flex items-center justify-between px-margin-mobile h-touch-target-min w-full z-50 bg-background dark:bg-background sticky top-0">
<div class="flex items-center gap-4">
<button class="hover:bg-surface-variant/50 dark:hover:bg-inverse-surface/50 transition-colors rounded-full p-2 active:opacity-80 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary dark:text-primary-fixed-dim">Create Account</h1>
</div>
<div class="hidden md:flex gap-4">
<!-- Desktop Navigation elements could go here if this was a top-level page -->
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow px-margin-mobile pt-stack-lg pb-32">
<div class="max-w-md mx-auto">
<!-- Progress Bar Section -->
<div class="flex flex-col gap-stack-sm mb-stack-lg">
<div class="flex justify-between items-center">
<span class="font-label-md text-label-md text-on-surface-variant">Step 3 of 3</span>
<span class="font-label-md text-label-md text-primary">Preferences</span>
</div>
<div class="h-1.5 w-full bg-primary/10 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500 ease-in-out" style="width: 100%;"></div>
</div>
</div>
<!-- Welcome/Hero Text -->
<div class="mb-stack-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile mb-stack-sm">What are you looking for?</h2>
<p class="text-on-surface-variant font-body-lg">Select at least three interests to help us personalize your experience and connect you with the right opportunities.</p>
</div>
<!-- Interests Bento-ish Grid -->
<div class="grid grid-cols-2 gap-4 mb-stack-lg">
<button class="interest-chip group flex flex-col items-start p-4 bg-surface-container-lowest border border-outline-variant/30 rounded-xl transition-all duration-200 hover:shadow-md active:scale-95 text-left" onclick="toggleInterest(this)">
<div class="w-10 h-10 rounded-lg bg-surface-variant flex items-center justify-center mb-3 group-[.active]:bg-secondary group-[.active]:text-on-primary">
<span class="material-symbols-outlined" data-icon="palette">palette</span>
</div>
<span class="font-label-md text-label-md">Design</span>
</button>
<button class="interest-chip group flex flex-col items-start p-4 bg-surface-container-lowest border border-outline-variant/30 rounded-xl transition-all duration-200 hover:shadow-md active:scale-95 text-left" onclick="toggleInterest(this)">
<div class="w-10 h-10 rounded-lg bg-surface-variant flex items-center justify-center mb-3 group-[.active]:bg-secondary group-[.active]:text-on-primary">
<span class="material-symbols-outlined" data-icon="memory">memory</span>
</div>
<span class="font-label-md text-label-md">Tech</span>
</button>
<button class="interest-chip group flex flex-col items-start p-4 bg-surface-container-lowest border border-outline-variant/30 rounded-xl transition-all duration-200 hover:shadow-md active:scale-95 text-left" onclick="toggleInterest(this)">
<div class="w-10 h-10 rounded-lg bg-surface-variant flex items-center justify-center mb-3 group-[.active]:bg-secondary group-[.active]:text-on-primary">
<span class="material-symbols-outlined" data-icon="work">work</span>
</div>
<span class="font-label-md text-label-md">Business</span>
</button>
<button class="interest-chip group flex flex-col items-start p-4 bg-surface-container-lowest border border-outline-variant/30 rounded-xl transition-all duration-200 hover:shadow-md active:scale-95 text-left" onclick="toggleInterest(this)">
<div class="w-10 h-10 rounded-lg bg-surface-variant flex items-center justify-center mb-3 group-[.active]:bg-secondary group-[.active]:text-on-primary">
<span class="material-symbols-outlined" data-icon="trending_up">trending_up</span>
</div>
<span class="font-label-md text-label-md">Marketing</span>
</button>
<!-- Larger Card for broader discovery -->
<button class="interest-chip col-span-2 group flex items-center justify-between p-4 bg-surface-container-lowest border border-outline-variant/30 rounded-xl transition-all duration-200 hover:shadow-md active:scale-95 text-left" onclick="toggleInterest(this)">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-lg bg-surface-variant flex items-center justify-center group-[.active]:bg-secondary group-[.active]:text-on-primary">
<span class="material-symbols-outlined" data-icon="psychology">psychology</span>
</div>
<span class="font-label-md text-label-md">Artificial Intelligence</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-[.active]:text-secondary" data-icon="add_circle">add_circle</span>
</button>
</div>
<!-- Lifestyle Visual -->
<div class="rounded-xl overflow-hidden shadow-sm aspect-video mb-stack-lg relative group">
<img alt="Professionals collaborating" class="w-full h-full object-cover" data-alt="A professional and modern workspace scene featuring a diverse group of creatives collaborating around a large wooden table. The room is filled with bright, soft natural light streaming through large windows, creating an airy and approachable atmosphere. The color palette is composed of soft teals, crisp whites, and gentle blues, reflecting a corporate yet friendly modern aesthetic. The focus is on a shared laptop and colorful sketches, symbolizing innovation and business growth." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAUhXIDT9DzWsYImVtakBmU4JDcNtfOjaNAZLiYdHF0c7SY0LOAY6CAiu4KIRBIOllEMjP1E7jAEpr7EE_L1xlQ2yPJZqFDIyvEER1z0IAeC2J689FZ6AUIJp6-nz4b144z7KEECXqG3Pub8XVph31GarNU5jbfcq1TPrbBJEd8QQ_Gqm-vKV6aNKDM7qvsAZKdy-rtPYFjy1D98ncLC9K2EuYIPAp_gGL5NhnZEErJv1rwxXSpXCT43Mlj3jVoAs7OFku74KDnLQ"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent opacity-60"></div>
<div class="absolute bottom-4 left-4 right-4 text-white">
<p class="font-label-md text-label-md opacity-90">Personalized Insights</p>
<p class="font-body-lg">Get curated content based on your focus areas.</p>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex gap-stack-md px-margin-mobile py-4 bg-surface-container-lowest dark:bg-inverse-surface shadow-[0px_-4px_12px_rgba(0,0,0,0.05)] rounded-t-xl">
<button class="flex flex-row items-center justify-center border border-primary text-primary bg-transparent rounded-lg px-6 py-4 w-full font-label-md text-label-md hover:opacity-90 transition-opacity active:scale-[0.98] transition-transform duration-150">
<span class="material-symbols-outlined mr-2" data-icon="chevron_left">chevron_left</span>
            Back
        </button>
<button class="flex flex-row items-center justify-center bg-primary text-on-primary rounded-lg px-6 py-4 w-full font-label-md text-label-md hover:opacity-90 transition-opacity active:scale-[0.98] transition-transform duration-150 shadow-md">
            Continue
            <span class="material-symbols-outlined ml-2" data-icon="chevron_right">chevron_right</span>
</button>
</nav>
<script>
        function toggleInterest(element) {
            element.classList.toggle('active');
            
            // Visual feedback for the chip's internal components
            const iconContainer = element.querySelector('div');
            const addIcon = element.querySelector('.material-symbols-outlined[data-icon="add_circle"]');
            
            if (element.classList.contains('active')) {
                element.classList.add('bg-secondary-fixed', 'border-secondary');
                element.classList.remove('bg-surface-container-lowest', 'border-outline-variant/30');
                if (addIcon) addIcon.innerText = 'check_circle';
            } else {
                element.classList.remove('bg-secondary-fixed', 'border-secondary');
                element.classList.add('bg-surface-container-lowest', 'border-outline-variant/30');
                if (addIcon) addIcon.innerText = 'add_circle';
            }
        }
    </script>
</body></html>
