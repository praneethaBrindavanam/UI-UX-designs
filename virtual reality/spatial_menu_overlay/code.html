<!DOCTYPE html>

<style>
    .glass-panel {
      backdrop-filter: blur(40px);
      background: rgba(19, 19, 21, 0.4);
      border: 1px solid rgba(0, 219, 233, 0.2);
    }
    .neon-glow-primary {
      box-shadow: 0 0 15px rgba(0, 219, 233, 0.4);
    }
    .neon-border-hover:hover {
      border-color: #00dbe9;
      box-shadow: 0 0 10px rgba(0, 219, 233, 0.3);
    }
    .spatial-slider::-webkit-slider-runnable-track {
      background: rgba(185, 202, 203, 0.2);
      height: 4px;
      border-radius: 2px;
    }
    .spatial-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #00dbe9;
      margin-top: -6px;
      box-shadow: 0 0 10px rgba(0, 219, 233, 0.8);
    }
    .mask-gradient {
      mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md overflow-hidden min-h-screen selection:bg-primary-container selection:text-on-primary-container">
<!-- Background Environment Simulator -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_50%,rgba(0,105,112,0.15),transparent_70%)]"></div>
<img class="w-full h-full object-cover opacity-20 grayscale brightness-50" data-alt="A cinematic, high-fidelity view of a futuristic digital nebula in deep space. Wisps of cyan and obsidian gases swirl around distant, glowing geometric structures. The lighting is low-key with intense bioluminescent accents of primary teal, creating a sense of immense depth and spatial immersion. The aesthetic is clean, sharp, and technologically advanced, suggesting a high-end VR environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAa39TQGmGEbnghCyIaTA_KFxgRlSj3Bp7q0RwPH2ZiPKW-Z6xl2AV2y53K1TLJVu-Vd0hfX3hC_hQaV9ngMbSKT4wqACUEl8lh7Im2N5K76xau-PTP4chkWtJ2gQAosg3l7viNg-SJ-12oeIt6-ncZ57ax4ARo-AuiJnzjKhEwaJOl4uf_Cs3kr7LRUt7fdfmXL-w7Gjp460LcZSDYKOc7h5a2Nt4PWxfszhin4dn0-BZUE20WE2LtshEZ0RiQ6UhKjtBY-hHkfss"/>
</div>
<!-- Top Navigation Shell -->
<header class="fixed top-0 w-full bg-background/40 backdrop-blur-xl border-b border-primary/20 shadow-[0_4px_30px_rgba(0,0,0,0.1)] flex justify-between items-center px-margin-mobile h-16 w-full z-[100]">
<div class="flex items-center gap-unit">
<span class="material-symbols-outlined text-primary" data-icon="spatial_tracking">spatial_tracking</span>
<h1 class="font-headline-md-mobile text-headline-md-mobile font-bold tracking-tighter text-primary-fixed-dim drop-shadow-[0_0_8px_rgba(0,219,233,0.5)]">OBSIDIAN HORIZON</h1>
</div>
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-primary/10 transition-all duration-300">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="settings_accessibility">settings_accessibility</span>
</button>
</div>
</header>
<!-- Main Spatial Menu Overlay -->
<main class="relative z-10 flex items-center justify-center min-h-screen px-margin-mobile">
<div class="glass-panel w-full max-w-lg rounded-[32px] p-8 shadow-[0_20px_50px_rgba(0,0,0,0.5)] border border-primary/20">
<!-- Menu Header -->
<div class="flex justify-between items-center mb-10">
<div>
<h2 class="font-headline-md text-headline-md text-primary tracking-tight">System Core</h2>
<p class="font-label-mono text-label-mono text-on-surface-variant uppercase opacity-60">Status: Optimized</p>
</div>
<div class="flex gap-2">
<div class="px-3 py-1 rounded-full bg-tertiary-container/20 border border-tertiary/30">
<span class="font-label-mono text-label-mono text-tertiary">92%</span>
</div>
</div>
</div>
<!-- Quick Toggles Grid -->
<div class="grid grid-cols-3 gap-4 mb-8">
<button class="flex flex-col items-center gap-3 p-4 rounded-2xl glass-panel border-primary/10 hover:border-primary/60 hover:bg-primary/5 transition-all duration-300 group">
<span class="material-symbols-outlined text-primary group-hover:scale-110 duration-200" data-icon="wifi">wifi</span>
<span class="font-label-mono text-label-mono text-on-surface-variant">Network</span>
</button>
<button class="flex flex-col items-center gap-3 p-4 rounded-2xl glass-panel border-primary/10 hover:border-primary/60 hover:bg-primary/5 transition-all duration-300 group bg-primary/10 border-primary/40">
<span class="material-symbols-outlined text-primary scale-110" data-icon="bluetooth" style="font-variation-settings: 'FILL' 1;">bluetooth</span>
<span class="font-label-mono text-label-mono text-primary">Sync</span>
</button>
<button class="flex flex-col items-center gap-3 p-4 rounded-2xl glass-panel border-primary/10 hover:border-primary/60 hover:bg-primary/5 transition-all duration-300 group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary duration-200" data-icon="security_update_good">security_update_good</span>
<span class="font-label-mono text-label-mono text-on-surface-variant">Safety</span>
</button>
</div>
<!-- Interactive Sliders -->
<div class="space-y-6 mb-10">
<div class="space-y-3">
<div class="flex justify-between items-center px-1">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="brightness_high">brightness_high</span>
<span class="font-body-md text-body-md text-on-surface">Luminance</span>
</div>
<span class="font-label-mono text-label-mono text-primary">85</span>
</div>
<input class="w-full appearance-none bg-transparent spatial-slider" type="range" value="85"/>
</div>
<div class="space-y-3">
<div class="flex justify-between items-center px-1">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="volume_up">volume_up</span>
<span class="font-body-md text-body-md text-on-surface">Spatial Audio</span>
</div>
<span class="font-label-mono text-label-mono text-primary">60</span>
</div>
<input class="w-full appearance-none bg-transparent spatial-slider" type="range" value="60"/>
</div>
<div class="space-y-3">
<div class="flex justify-between items-center px-1">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="grid_view">grid_view</span>
<span class="font-body-md text-body-md text-on-surface">Boundary Scale</span>
</div>
<span class="font-label-mono text-label-mono text-primary">4.2m</span>
</div>
<input class="w-full appearance-none bg-transparent spatial-slider" type="range" value="40"/>
</div>
</div>
<!-- Footer Action -->
<div class="flex gap-4">
<button class="flex-1 py-4 bg-primary-container text-on-primary-container font-headline-md text-[18px] rounded-2xl flex items-center justify-center gap-2 hover:brightness-110 active:scale-95 transition-all duration-200 neon-glow-primary">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
          Exit VR
        </button>
<button class="w-16 h-16 rounded-2xl border border-primary/20 flex items-center justify-center hover:bg-primary/10 transition-all">
<span class="material-symbols-outlined text-primary" data-icon="close">close</span>
</button>
</div>
</div>
</main>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-margin-mobile left-0 right-0 mx-auto w-fit z-[100] flex gap-gutter p-2 bg-surface-container-lowest/40 backdrop-blur-2xl border border-primary/20 rounded-full shadow-[0_0_20px_rgba(0,219,233,0.15)]">
<a class="flex items-center justify-center text-on-surface-variant w-12 h-12 hover:text-primary-fixed-dim transition-all" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
</a>
<a class="flex items-center justify-center text-on-surface-variant w-12 h-12 hover:text-primary-fixed-dim transition-all" href="#">
<span class="material-symbols-outlined" data-icon="precision_manufacturing">precision_manufacturing</span>
</a>
<a class="flex items-center justify-center bg-primary text-on-primary rounded-full w-12 h-12 shadow-[0_0_15px_rgba(0,219,233,0.6)]" href="#">
<span class="material-symbols-outlined" data-icon="blur_on" style="font-variation-settings: 'FILL' 1;">blur_on</span>
</a>
<a class="flex items-center justify-center text-on-surface-variant w-12 h-12 hover:text-primary-fixed-dim transition-all" href="#">
<span class="material-symbols-outlined" data-icon="front_hand">front_hand</span>
</a>
</nav>
<!-- Floating HUD Elements -->
<aside class="fixed right-margin-desktop top-1/2 -translate-y-1/2 hidden md:flex flex-col gap-6 z-20">
<div class="glass-panel p-4 rounded-2xl border-l-4 border-l-primary flex flex-col items-center gap-2 opacity-80">
<span class="font-label-mono text-[10px] uppercase opacity-40">Ping</span>
<span class="font-headline-md text-primary text-[20px]">12ms</span>
</div>
<div class="glass-panel p-4 rounded-2xl border-l-4 border-l-secondary flex flex-col items-center gap-2 opacity-80">
<span class="font-label-mono text-[10px] uppercase opacity-40">FPS</span>
<span class="font-headline-md text-secondary text-[20px]">120</span>
</div>
</aside>
<!-- Background Decorative Lines -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-10">
<div class="absolute top-1/4 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-primary to-transparent"></div>
<div class="absolute top-3/4 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-primary to-transparent"></div>
<div class="absolute top-0 left-1/4 w-[1px] h-full bg-gradient-to-b from-transparent via-primary to-transparent"></div>
<div class="absolute top-0 left-3/4 w-[1px] h-full bg-gradient-to-b from-transparent via-primary to-transparent"></div>
</div>
