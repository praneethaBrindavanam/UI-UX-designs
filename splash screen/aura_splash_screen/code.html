<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes progress {
            0% { width: 0%; left: 0; }
            50% { width: 25%; left: 75%; }
            100% { width: 0%; left: 100%; }
        }

        .animate-splash {
            animation: fadeInScale 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .loading-line {
            height: 2px;
            background: #3525cd;
            position: relative;
            overflow: hidden;
            width: 80px;
            border-radius: 999px;
        }

        .loading-line-inner {
            content: '';
            position: absolute;
            height: 100%;
            background: #4d44e3;
            animation: progress 2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }
    </style>

            </h1>
<!-- Value Prop / Subtitle (Subtle) -->
<p class="font-label-sm text-label-sm text-secondary tracking-widest uppercase opacity-60">

            </p>
</section>
<!-- Bottom Loading Section -->
<footer class="flex flex-col items-center gap-stack-sm">
<div class="loading-line bg-surface-container-high">
<div class="loading-line-inner"></div>
</div>
<p class="font-label-sm text-label-sm text-outline tracking-wider uppercase opacity-40">
                Initializing
            </p>
</footer>
</main>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Subtle parallax or glow effect based on mouse movement (for desktop view)
            if (window.innerWidth > 768) {
                document.addEventListener('mousemove', (e) => {
                    const x = (e.clientX / window.innerWidth - 0.5) * 10;
                    const y = (e.clientY / window.innerHeight - 0.5) * 10;
                    const logo = document.querySelector('img');
                    if (logo) {
                        logo.style.transform = `translate(${x}px, ${y}px)`;
                        logo.style.transition = 'transform 0.2s ease-out';
                    }
                });
            }

            // Simulate loading completion for visual feedback (though it's a splash, we stay here)
            const loadingText = document.querySelector('footer p');
            const states = ['Connecting', 'Syncing', 'Ready'];
            let i = 0;
            
            setInterval(() => {
                if (i < states.length) {
                    loadingText.style.opacity = '0';
                    setTimeout(() => {
                        loadingText.textContent = states[i];
                        loadingText.style.opacity = '0.4';
                        i++;
                    }, 300);
                }
            }, 2500);
        });
    </script>
